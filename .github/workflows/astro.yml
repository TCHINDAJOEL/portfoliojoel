name: Deploy redirect to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate redirect page
        run: |
          mkdir -p dist
          cat > dist/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="fr">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Redirection en cours...</title>
              <meta http-equiv="refresh" content="0; url=https://portfolio.deboston.space/" />
              <link rel="canonical" href="https://portfolio.deboston.space/" />
            </head>
            <body>
              <script>window.location.replace('https://portfolio.deboston.space/');</script>
              <p>Ce portfolio a déménagé. Si la redirection ne fonctionne pas, <a href="https://portfolio.deboston.space/">cliquez ici</a>.</p>
            </body>
          </html>
          EOF

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@4.1.7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: ./dist
